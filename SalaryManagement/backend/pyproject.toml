
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "acme-salary-management-backend"
version = "0.1.0"
description = "Backend for ACME Salary Management"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "Faker>=30,<40",
    "email-validator>=2.2,<3.0",
    "pycountry>=24.6,<27",
    "alembic>=1.14,<2.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.27,<1.0",
    "ruff>=0.9,<1.0",
    "black>=24.10,<27",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*"]


# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"


# Ruff lint configuration
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["app", "tests"]


[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


# Black formatting configuration
[tool.black]
line-length = 88
target-version = ["py311"]
