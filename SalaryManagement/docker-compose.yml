
services:
  db:
    image: postgres:17-alpine
    container_name: salary_management_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salary_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-salary_management_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: salary-management-api:local
    container_name: salary_management_api
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-salary_management_user}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-salary_management_db}
      DEBUG: "false"

    ports:
      - "${API_PORT:-8000}:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: salary-management-frontend:local
    container_name: salary_management_frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT:-3000}:80"

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
